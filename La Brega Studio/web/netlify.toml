# Configuración de Netlify para La Brega Estudio
# Web estática, sin build. Se publica SOLO la v5 (v5_DEF/): la raíz y v2-v4 son versiones viejas.

[build]
  publish = "v5_DEF"

# Cabeceras: cachea los assets, no cachea el HTML (para que los cambios se vean al instante)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

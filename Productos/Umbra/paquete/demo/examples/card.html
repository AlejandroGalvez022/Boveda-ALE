<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umbra — three on one page</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font:16px/1.6 ui-sans-serif,system-ui,sans-serif;background:#0a0a0c;color:#f2f0ee;
    padding:clamp(24px,6vw,80px)}
  h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;margin-bottom:10px}
  .sub{color:#9c9891;max-width:60ch;margin-bottom:44px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .card{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;
    border:1px solid rgba(242,240,238,.12);display:flex;align-items:flex-end;padding:26px}
  .card .fg{position:relative;z-index:2}
  .card h2{font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
  .card p{font-size:13.5px;color:#b9b5ae}
  /* A floor of shade under the text: the corona moves, the copy must not
     stop being readable when it drifts past. */
  .card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(transparent 45%,rgba(6,6,8,.9))}
</style>
</head>
<body>

<h1>It is not only for heroes.</h1>
<p class="sub">Each card is its own instance, with its own palette. They pause themselves
   when they scroll out of view, so three on a page costs about the same as one.</p>

<div class="grid">
  <div class="card" data-umbra data-umbra-preset="solar"  data-umbra-radius="0.34" data-umbra-y="0.38" data-umbra-orbits="0.5" data-umbra-vignette="0.5">
    <div class="fg"><h2>Solar</h2><p>Warm, close, a little furious.</p></div>
  </div>
  <div class="card" data-umbra data-umbra-preset="ice"    data-umbra-radius="0.30" data-umbra-y="0.40" data-umbra-stars="1.4" data-umbra-vignette="0.5">
    <div class="fg"><h2>Ice</h2><p>Cold light, deep field.</p></div>
  </div>
  <div class="card" data-umbra data-umbra-preset="toxic"  data-umbra-radius="0.32" data-umbra-y="0.40" data-umbra-speed="1.6" data-umbra-vignette="0.5">
    <div class="fg"><h2>Toxic</h2><p>Faster, and not sorry about it.</p></div>
  </div>
</div>

<script src="../../dist/umbra.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umbra — minimal (no JavaScript)</title>
<style>
  body{margin:0;font:16px/1.5 ui-sans-serif,system-ui,sans-serif;background:#08080b;color:#f2f0ee}
  .hero{height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
  .hero .in{position:relative;z-index:2;max-width:22ch}
  h1{font-size:clamp(38px,8vw,84px);letter-spacing:-.04em;line-height:.95;margin:0 0 14px}
  p{color:#9c9891;margin:0}
</style>
</head>
<body>

<!--
  The smallest possible use: no JavaScript of your own at all.
  Everything is configured with data- attributes, and the script
  finds the element and starts itself.
-->
<div class="hero" data-umbra
     data-umbra-preset="ember"
     data-umbra-radius="0.28"
     data-umbra-y="0.42">
  <div class="in">
    <h1>Zero lines of JS</h1>
    <p>Configured entirely with <code>data-</code> attributes.</p>
  </div>
</div>

<script src="../../dist/umbra.js"></script>
</body>
</html>

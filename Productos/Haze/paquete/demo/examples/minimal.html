<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haze — minimal (no JavaScript)</title>
<style>
  body{margin:0;font:16px/1.5 ui-sans-serif,system-ui,sans-serif;background:#0a0713;color:#f2f4f6}
  .hero{position:relative;height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 50%,rgba(10,7,19,.72),transparent 75%)}
  .hero .in{position:relative;z-index:2;max-width:22ch}
  h1{font-size:clamp(38px,8vw,84px);letter-spacing:-.045em;line-height:.95;margin:0 0 14px}
  p{color:#98a1ab;margin:0}
</style>
</head>
<body>

<!--
  The smallest possible use: not a line of your own JavaScript.
  Everything is set with data- attributes and the script starts itself.
-->
<div class="hero" data-haze
     data-haze-motif="silk"
     data-haze-palette="dusk"
     data-haze-scale="0.9"
     data-haze-energy="0.6">
  <div class="in">
    <h1>Zero lines of JS</h1>
    <p>Configured entirely with <code>data-</code> attributes.</p>
  </div>
</div>

<script src="../../dist/haze.js"></script>
</body>
</html>
